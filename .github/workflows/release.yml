name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build frontend
        run: |
          cd web && npm ci && npm run build
          cd .. && rm -rf internal/web/dist && mkdir -p internal/web/dist && cp -r web/dist/. internal/web/dist/
      - name: Test
        run: go test ./...
      - name: Build binaries
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.Version=${VERSION}" -o bin/olspanel-linux-amd64 ./cmd/olspanel
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.Version=${VERSION}" -o bin/olspanel-linux-arm64 ./cmd/olspanel
          cd bin && sha256sum olspanel-linux-* > SHA256SUMS
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/olspanel-linux-amd64
            bin/olspanel-linux-arm64
            bin/SHA256SUMS
            install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: olspanel-binaries
          path: bin/
